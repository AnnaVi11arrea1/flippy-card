<!DOCTYPE html>
<html>

<head>
    <title>Flippy Tiles & Flashcards</title>
    <link rel="stylesheet" href="index.css">
    <script src="config.js"></script>
</head>

<body>
    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" data-tab="game">Memory Game</button>
        <button class="tab-btn" data-tab="flashcard">Flashcards</button>
    </div>

    <!-- Memory Game Section -->
    <div id="game" class="tab-content active">
        <div class="header">
            <h1>Flippy Tiles</h1>
            <button id="start">Play Sample Game</button>
            <button id="reset" style="display: none;">Reset</button>
            <button id="easy-mode">AI Study Mode</button>
            <div id="score">Score: 0</div>
        </div>
        <div class="game-container">
            <div id="game-tiles">
                <div class="tile" data-id="1">
                    <div class="tile-inner">
                        <div class="tile-front"></div>
                        <div class="tile-back"></div>
                    </div>
                </div>
                <div class="tile" data-id="2">
                    <div class="tile-inner">
                        <div class="tile-front"></div>
                    <div class="tile-back"></div>
                </div>
            </div>
            <div class="tile" data-id="3">
                <div class="tile-inner">
                    <div class="tile-front"></div>
                    <div class="tile-back"></div>
                </div>
            </div>
            <div class="tile" data-id="4">
                <div class="tile-inner">
                    <div class="tile-front"></div>
                    <div class="tile-back"></div>
                </div>
            </div>
            <div class="tile" data-id="5">
                <div class="tile-inner">
                    <div class="tile-front"></div>
                    <div class="tile-back"></div>
                </div>
            </div>
            <div class="tile" data-id="6">
                <div class="tile-inner">
                    <div class="tile-front"></div>
                    <div class="tile-back"></div>
                </div>
            </div>
            <div class="tile" data-id="7">
                <div class="tile-inner">
                    <div class="tile-front"></div>
                    <div class="tile-back"></div>
                </div>
            </div>
            <div class="tile" data-id="8">
                <div class="tile-inner">
                    <div class="tile-front"></div>
                    <div class="tile-back"></div>
                </div>
            </div>
            <div class="tile" data-id="9">
                <div class="tile-inner">
                    <div class="tile-front"></div>
                    <div class="tile-back"></div>
                </div>
            </div>
            <div class="tile" data-id="10">
                <div class="tile-inner">
                    <div class="tile-front"></div>
                    <div class="tile-back"></div>
                </div>
            </div>
            <div class="tile" data-id="11">
                <div class="tile-inner">
                    <div class="tile-front"></div>
                    <div class="tile-back"></div>
                </div>
            </div>
            <div class="tile" data-id="12">
                <div class="tile-inner">
                    <div class="tile-front"></div>
                    <div class="tile-back"></div>
                </div>
            </div>
        </div>
            <!-- Game tiles will be dynamically generated here -->
        </div>
    </div>

    <!-- Flashcard Section -->
    <div id="flashcard-section" class="tab-content">
        <div class="header">
            <h1>AI Flashcard Generator</h1>
            <div id="message" class="message"></div>
        </div>

        <div class="flashcard-setup">
            <div class="setup-group">
                <label for="pdf-upload">Upload PDF or Text File:</label>
                <input type="file" id="pdf-upload" accept=".pdf,.txt">
            </div>

            <div class="setup-group">
                <label for="pdf-text">Or paste text here:</label>
                <textarea id="pdf-text" placeholder="Paste your study material here..." rows="6"></textarea>
            </div>

            <div class="setup-group">
                <label for="num-cards">Number of flashcards:</label>
                <input type="number" id="num-cards" value="10" min="1" max="50">
            </div>

            <button id="generate-btn" disabled>Generate Flashcards with ChatGPT</button>
            <button id="export-btn" class="secondary-btn" onclick="window.flashcardSystem.exportFlashcards()">Export Flashcards</button>
            <button id="import-btn" class="secondary-btn" onclick="document.getElementById('import-file').click()">Import Flashcards</button>
            <input type="file" id="import-file" accept=".json" style="display: none;" onchange="window.flashcardSystem.importFlashcards(this.files[0])">
        </div>

        <div id="flashcard-container" style="display: none;">
            <div class="flashcard-header">
                <h2>Study Your Flashcards</h2>
                <div id="score-display" style="display: none;">Score: 0/0 (0%)</div>
                <div id="progress">0 / 0</div>
            </div>

            <div id="flashcard" class="flashcard">
                <div class="flashcard-inner">
                    <div class="flashcard-front"></div>
                    <div class="flashcard-back"></div>
                </div>
            </div>

            <div class="flashcard-hint">Click card to reveal answer</div>

            <div id="nav-buttons" class="nav-buttons">
                <button id="prev-btn" class="nav-btn">← Previous</button>
                <button id="review-btn" class="review-btn">Start Review Mode</button>
                <button id="next-btn" class="nav-btn">Next →</button>
            </div>

            <div id="flashcard-controls" class="flashcard-controls" style="display: none;">
                <button id="correct-btn" class="correct-btn">✓ Correct</button>
                <button id="incorrect-btn" class="incorrect-btn">✗ Incorrect</button>
            </div>
        </div>
    </div>

    <script src="flashcard.js"></script>
    <script src="index.js"></script>
</body>

</html>
